<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cloud Application</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: #ffffff;
    }
    .container {
      text-align: center;
      padding: 40px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }
    h1 {
      margin-bottom: 15px;
      font-size: 32px;
    }
    p {
      font-size: 18px;
      margin: 5px 0;
    }
    footer {
      margin-top: 20px;
      font-size: 14px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome to My Cloud Application</h1>
    <p>This application is running on</p>
    <p><strong>AWS (EKS) · Azure (AKS) · Google Cloud (GKE)</strong></p>
    <footer>
      Developed by <strong>Vamsi</strong>
    </footer>
  </div>
</body>
</html>
